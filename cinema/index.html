<meta charset="utf-8">
<script>try{var th=localStorage.getItem("lumen.theme");if(th==="\"dark\"")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen Cinemas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%2314161f%22/%3E%3Cpath d=%22M4 8.5a1.8 1.8 0 0 0 1.8-1.8h12.4A1.8 1.8 0 0 0 20 8.5v1.7a1.8 1.8 0 0 0 0 3.6v1.7a1.8 1.8 0 0 0-1.8 1.8H5.8A1.8 1.8 0 0 0 4 15.5v-1.7a1.8 1.8 0 0 0 0-3.6z%22 fill=%22%23ffc72c%22/%3E%3Cpath d=%22M14 7.5v9%22 stroke=%22%2314161f%22 stroke-width=%221.4%22 stroke-dasharray=%221.6 1.4%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#14161f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="description" content="Book movie tickets and see the view from your seat in 3D before you book.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">

<header class="hdr">
  <div class="hdr-in">
    <a class="logo" href="#home" aria-label="Lumen home"><span class="logo-dot"></span>Lumen</a>
    <button type="button" class="hbtn city" id="cityBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="cityLbl">Chennai</span></button>
    <span class="grow"></span>
    <button type="button" class="hbtn icon-only" id="searchBtn" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button type="button" class="hbtn icon-only" id="themeBtn" aria-label="Switch to dark theme"></button>
    <button type="button" class="hbtn" id="langBtn" lang="ta">தமிழ்</button>
    <button type="button" class="hbtn" id="ticketsBtn">Tickets</button>
    <button type="button" class="hbtn icon-only" id="acctBtn" aria-label="Account" hidden></button>
  </div>
  <nav class="cats" id="cats" aria-label="Categories"></nav>
</header>

<div class="demo-bar" id="demoBar" hidden></div>

<main id="view" class="view"><div class="boot">Loading…</div></main>

<button type="button" class="fab" id="askFab">Book by voice</button>

<div class="sheet" id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><button type="button" class="iconbtn sheet-x" id="sheetClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="sheetBody"></div></div></div>

<div class="viewer" id="viewer" hidden>
  <div class="vw-top"><b id="vwTitle"></b><button type="button" class="iconbtn" id="vwClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="vw-host" id="vwHost"></div>
  <div class="pv-score vw-score" id="vwScore" hidden></div>
  <div class="vw-bottom"><div class="seg" id="vwPresets"><button type="button" data-p="overview">Hall</button><button type="button" data-p="front">Front</button><button type="button" data-p="back">Back</button></div><p class="vw-tip" id="vwTip"></p></div>
</div>

<div class="agent" id="agent" hidden>
  <div class="ag-card" role="dialog" aria-modal="true" aria-labelledby="agTitle">
    <div class="ag-top"><span class="ag-ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><span class="ag-t"><b id="agTitle">Ask Lumen</b><small id="agentStat">On-device AI</small></span>
      <button type="button" class="iconbtn" id="agentSpeak" aria-pressed="false" aria-label="Read replies aloud" title="Read replies aloud"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></button>
      <button type="button" class="iconbtn" id="agentClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="ag-log" id="agentLog" aria-live="polite"></div>
    <div class="ag-chips" id="agentChips"></div>
    <form class="ag-form" id="agentForm"><input id="agentInput" class="input" autocomplete="off" placeholder="Type or tap the mic…" aria-label="Message"><button type="button" class="mic" id="agentMic" aria-label="Speak"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button type="submit" class="send" aria-label="Send"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6z"/></svg></button></form>
  </div>
</div>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
